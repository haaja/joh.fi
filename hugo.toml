baseURL = "https://joh.fi/"
locale = "en-US"
title = "joh.fi"
theme = "hugo-goa"

enableRobotsTXT = true

# Posts are labelled with tags only; categories are not used. Term pages
# don't get their own RSS feeds (one site-wide feed is enough).
[taxonomies]
tag = "tags"

[outputs]
taxonomy = ["html"]
term = ["html"]

# Code is highlighted client-side by highlight.js (light/dark aware),
# so keep Hugo's Chroma from also styling fenced code blocks.
[markup.highlight]
codeFences = false

[params]
author = "Janne Haapsaari"
intro = "Making software, writing bugs and family life. Tinkerer by heart."
description = "Principal Software Engineer @[Qvik](https://qvik.com). Previously @RELEX, @Airbus"
authorimage = "janne.webp"
dateformat = "Jan 2, 2006"

