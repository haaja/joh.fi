<header class="text-center header">
  {{ with .Site.Params.authorimage }}
  {{ with or (resources.Get (printf "images/%s" .)) (resources.Get (printf "img/%s" .)) }}
  {{/* Displayed at 180px (.headshot); 360px covers 2x screens. */}}
  {{ $img := .Resize "360x webp q80" }}
  <img src="{{ $img.RelPermalink }}" width="180" height="180" alt="Author Image" fetchpriority="high"
    class="img-fluid rounded-circle mx-auto d-block headshot">
  {{ end }}
  {{ end }}

  <h1 class="author mt-3">{{ .Site.Params.author }}</h1>
</header>
